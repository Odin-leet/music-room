services:
  postgres:
    image: postgres:16-alpine
    container_name: music-room-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER:-music_room}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-music_room}
      POSTGRES_DB: ${DB_NAME:-music_room_dev}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - music_room_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-music_room}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Dev-only fake mail server: catches every email the API sends (nothing is
  # really delivered) and shows it in a web inbox at http://localhost:8025.
  mailpit:
    image: axllent/mailpit:latest
    container_name: music-room-mailpit
    restart: unless-stopped
    environment:
      # Accept whatever MAIL_USER/MAIL_PASSWORD the API sends, over plain SMTP.
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - "1025:1025" # SMTP — the API sends here
      - "8025:8025" # web inbox

volumes:
  music_room_pgdata:
